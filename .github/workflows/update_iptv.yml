name: Auto Update IPv6 IPTV

on:
  schedule:
    # 每天早间 06:25 与 晚间 18:25 各自动运行一次（避开整点 00 分，防止 GitHub Actions 高峰期排队或丢弃任务）
    - cron: '25 22 * * *'  # 北京时间 06:25 每日早间自动更新
    - cron: '25 10 * * *'  # 北京时间 18:25 每日晚间自动更新
  workflow_dispatch:      # 支持 GitHub 网页端一键手动立即运行

# 赋予云端 Actions 写入和推送仓库的权限
permissions:
  contents: write

jobs:
  crawl_and_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Crawler with Strict Live Verification
        run: |
          python main.py --workers 35 --timeout 2.5

      - name: Commit and Push Verified Streams
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          UPDATE_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: $UPDATE_TIME (CST) [skip ci]" && git push)
