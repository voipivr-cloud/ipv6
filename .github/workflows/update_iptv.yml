name: Auto Update IPv6 IPTV

on:
  schedule:
    - cron: '0 20 * * *'  # 每天北京时间凌晨 04:00 自动运行
  workflow_dispatch:      # 支持手动触发

# 赋予云端 Actions 写入和推送仓库的权限
permissions:
  contents: write

jobs:
  crawl_and_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Crawler with Strict Live Verification
        run: |
          python main.py --workers 35 --timeout 2.5

      - name: Commit and Push Verified Streams
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: 100% verified playable streams [skip ci]" && git push)
